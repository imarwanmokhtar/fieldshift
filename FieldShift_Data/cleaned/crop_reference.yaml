schema_version: 2
generated_by: "FieldShift data sprint (AI-assisted fetch + verification), session 2026-10-30"
generated_on: "2026-10-30"
location_note: "Sowing windows and durations reference Egypt (Delta where available). Pilot location 31.04N 31.38E is coordinates_illustrative; local verification is part of 'check locally'."
verification_extract: "FieldShift_Data/raw/crops/crop_table_verification_extract_20261030.md"

sources:
  FAO56_T11: "FAO Irrigation and Drainage Paper 56, Ch.6, Table 11 (lengths of crop development stages) https://www.fao.org/4/x0490e/x0490e0b.htm — FETCHED & VERIFIED 2026-10-30 (artifact raw/crops/fao56_ch6_tables11_12_fetched_20261030.txt, sha256 36199f...c4). Table 11 states values are 'a general guide and for comparison purposes'. Stray footnote digits in the printed table are documented in the extract."
  FAO56_T12: "FAO-56, Ch.6, Table 12 (single crop coefficients Kc), same URL & artifact — VERIFIED 2026-10-30. Ranges printed for Kc mid/end (e.g. 0.60-0.35 + footnote digit) are recorded in notes; the first printed value is used."
  FAO29_T4: "FAO Irrigation and Drainage Paper 29 Rev.1 (Ayers & Westcot 1985), Table 4 'Crop tolerance and yield potential ... (ECw) or soil salinity (ECe)' https://www.fao.org/4/T0234e/T0234E03.htm — FETCHED & VERIFIED 2026-10-30 (artifact raw/crops/fao29_rev1_salt_tolerance_20261030.htm). ECe values below are the 100%-yield thresholds (dS/m, saturated soil-paste extract). Berseem has NO numeric row there; sec.5 lists 'Clover, Berseem' qualitatively as moderately sensitive."
  FAO_WATER_T5: "FAO Irrigation Water Management Training manual, Ch.2 Table 5 'Approximate values of seasonal crop water needs' https://www.fao.org/4/S2022E/s2022e02.htm — FETCHED 2026-10-30 (artifact raw/crops/fao_water_manual/fao_water_manual_s2022e02_20261030.htm). mm per total growing period; berseem row absent."
  FAO_WATER_T14: "FAO Irrigation Water Management Training manual, Ch.3 Table 14 'Indicative values of crop water needs and sensitivity to drought' https://www.fao.org/4/S2022E/s2022e07.htm — FETCHED 2026-10-30 (artifact fao_water_manual_s2022e07_20261030.htm). Compound classes are collapsed into low|medium|high by the documented rule under drought_class_mapping."
  FAO33_VIA66: "FAO Irrigation and Drainage Paper 66 (Steduto et al. 2012), Ch.2 Table 1 'Seasonal Ky values from FAO I&D Paper No. 33 (Doorenbos & Kassam 1979)' https://www.fao.org/4/i2800e/i2800e02.pdf — numeric Ky evidence quoted in drought_sensitivity notes; contains no rice row."
  FAO_CROP_CAL: "FAO crop calendar for Egypt, agro-ecological zones, lastUpdated 2021-02-26 — DHLG API https://api-cropcalendar.apps.fao.org/api/v1/countries/EG/cropCalendar?language=en (artifact raw/crops/fao_dhlg_cropcalendar_egy_20261030.json), cross-checked against the FAO data-catalog export (artifact fao_crop_calendar_by_country_all_20261030.csv); the two agree."
  ECOCROP_MIRROR: "EcoCrop crop database mirror https://github.com/OpenCLIM/ecocrop (EcoCrop_DB.csv, sha256 4187e8...06), column units confirmed via Ecocrop_variable_lookup.csv (temperatures degC; pH unitless; KTMP = killing temperature early growth). Software licence OGL-UK-3.0 per CITATION.cff (DOI 10.5281/zenodo.10843625); underlying FAO EcoCrop data licence still to be checked by a human."
  FAO_I3500E: "FAO 'Egyptian Clover — King of Forage Crops' (Dost, Attia, Hazzaa, Khidr & Sany 2014, doc i3500e) https://openknowledge.fao.org/server/api/core/bitstreams/947fa627-c9f2-4f67-b725-e0ef30d220c7/content — FETCHED 2026-10-30 (artifact raw/crops/fao_i3500e_berseem_20261030.pdf); pages cited in notes are the 1-based PDF pages."
  GIEWS_EGY_BRIEF: "FAO GIEWS Country Brief, Arab Republic of Egypt, Reference Date 30-06-2026 https://cb.apps.fao.org/country/EGY/pdf/EGY.pdf — FETCHED 2026-10-30 (artifact giews_egy_country_brief_20261030.pdf). Observation: 'sowing operations for the 2026 rice and maize crops also began in May'."
  MAIZE_STUDY: "Hegab, Fayed, Hamada et al. 2019, Arab Universities Journal of Agricultural Sciences, 'Growth parameters, irrigation requirements and productivity of maize in relation to sowing dates under North-Delta of Egypt conditions', DOI 10.21608/ajs.2019.43523 — sowing-date trial at El-Bosaily (Northern Coastal Egypt): 1 May / 1 June / 1 July; productivity and WUE decreased as sowing delayed beyond 1 May. PDF could not be archived (HTTP 429); abstract snapshot logged in metadata/retrieval_log.jsonl."
  GENERAL: "General agronomic knowledge written by the AI assistant — NOT from a fetched source. Used only for botanical family, n_fixer and fallow."

slots:
  winter: {months: [11,12,1,2,3,4], label: "Winter Nov-Apr"}
  summer: {months: [5,6,7,8,9,10], label: "Summer May-Oct"}

defaults:
  stage_split_if_missing: {ini: 0.15, dev: 0.25, mid: 0.40, late: 0.20}   # ENGINE ASSUMPTION, flag stage_split_assumed

drought_class_mapping:
  rule: "FAO water manual Ch.3 Table 14 prints compound classes. The engine collapses each compound class to its MORE-SENSITIVE bound so water-short warnings stay on the safe side."
  printed_to_enum:
    low: low
    low-medium: medium
    medium: medium
    medium-high: high
    high: high

crops:
- crop_id: wheat
  names: {en: Wheat, ar: قمح, scientific: Triticum aestivum}
  category: cereal
  family: {v: Poaceae, src: GENERAL, status: general_fact}
  n_fixer: {v: false, src: GENERAL, status: general_fact}
  usual_slot: winter
  sowing_window: {v: {start: "11-15", end: "11-30"}, unit: "MM-DD", src: FAO_CROP_CAL, status: extracted, note: "Delta region session (also NDRNRL/NDRORL): sowing 11-15 to 11-30, harvest 04-25 to 05-25 (lastUpdated 2021-02-26)."}
  growth_duration_days: {v: 160, unit: days, src: FAO56_T11, status: extracted, note: "Row 'Barley/Oats/Wheat' 20/50/60/30 = 160 (Dec, Calif. Desert) — an ARID ANALOGUE, not Egypt. FAO calendar Egypt Delta growing_period is 150-190 days: the analogue value sits inside it; local verification advised."}
  stage_days: {v: {ini: 20, dev: 50, mid: 60, late: 30}, unit: days, src: FAO56_T11, status: extracted, note: "Stages sum to 160 = growth_duration_days."}
  kc: {v: {ini: 0.30, mid: 1.15, end: 0.25}, unit: "-", src: FAO56_T12, status: extracted, note: "Cereal-group Kc ini 0.3; Kc end printed 0.25-0.40 (footnote digit merged as '0.25-0.410'); FAO-56 also prints 0.4/0.7 for winter-wheat Kc ini (frozen/non-frozen soils); Kc ini depends on wetting frequency (FAO-56 Ch.7)."}
  water_requirement_mm_ref: {v: {min: 450, max: 650}, unit: "mm/season", src: FAO_WATER_T5, status: extracted, note: "Row 'Barley/Oats/Wheat 450-650' (mm/total growing period)."}
  temperature_c: {v: {topmn: 15.0, topmx: 23.0, tmin: 5.0, tmax: 27.0, ktmp: 0.0}, unit: "°C", src: ECOCROP_MIRROR, status: extracted, note: "T. aestivum row; killing temperature EARLY GROWTH (KTMP) = 0; KTMPR (during rest) = -20 (kept in note only)."}
  drought_sensitivity: {v: medium, unit: "low|medium|high", src: FAO_WATER_T14, status: extracted, note: "Table 14 prints 'low-medium' → collapsed to 'medium' (more-sensitive bound; drought_class_mapping). FAO-66 Table 1 seasonal Ky = 1.05 (winter wheat) / 1.15 (spring wheat)."}
  salinity_threshold_ece_dsm: {v: 6.0, unit: "dS/m", src: FAO29_T4, status: extracted, note: "100%-yield ECe threshold; durum wheat row = 5.7. Table also carries footnote digits ('4 , 6') at the wheat row — source-data artifacts."}
  soil_ph_range: {v: {ph_min: 5.5, ph_max: 8.5, ph_opt_min: 6.0, ph_opt_max: 7.0}, unit: pH, src: ECOCROP_MIRROR, status: extracted}

- crop_id: maize
  names: {en: Maize, ar: ذرة شامية, scientific: Zea mays}
  category: cereal
  family: {v: Poaceae, src: GENERAL, status: general_fact}
  n_fixer: {v: false, src: GENERAL, status: general_fact}
  usual_slot: summer
  sowing_window: {v: {start: "05-01", end: "07-01"}, unit: "MM-DD", src: MAIZE_STUDY, status: extracted, note: "North-Delta sowing-date trial (El-Bosaily): 1 May / 1 June / 1 July; later sowing gave lower productivity and WUE. GIEWS brief corroborates ('maize sowing began in May', 2026). Window END = latest TRIAL date, not an observed full window; no grain-maize row in either FAO calendar (only 'Corn, sweet' 02-20..10-15, growing 75-100 d). Verify locally."}
  growth_duration_days: {v: 150, unit: days, src: FAO56_T11, status: extracted, note: "Row 'Maize (grain)' 30/40/50/30 = 150 (April, Spain/Calif.) — not Egypt-specific; FAO calendar has no Egypt grain-maize row; sweet-corn row suggests 75-100 d cycles. Local verification needed."}
  stage_days: {v: {ini: 30, dev: 40, mid: 50, late: 30}, unit: days, src: FAO56_T11, status: extracted, note: "Stages sum to 150 = growth_duration_days."}
  kc: {v: {ini: 0.30, mid: 1.20, end: 0.60}, unit: "-", src: FAO56_T12, status: extracted, note: "Printed '0.60-0.3511' = end value 0.60 (harvest at high grain moisture) or 0.35 (field-dried; footnote 11)."}
  water_requirement_mm_ref: {v: {min: 500, max: 800}, unit: "mm/season", src: FAO_WATER_T5, status: extracted}
  temperature_c: {v: {topmn: 18.0, topmx: 33.0, tmin: 10.0, tmax: 47.0, ktmp: null}, unit: "°C", src: ECOCROP_MIRROR, status: extracted, note: "ktmp absent in the mirror row (null); other four extracted."}
  drought_sensitivity: {v: high, unit: "low|medium|high", src: FAO_WATER_T14, status: extracted, note: "Printed 'medium-high' → collapsed to 'high' (more-sensitive bound). FAO-66 Table 1 seasonal Ky = 1.25 supports greater-than-proportional yield loss."}
  salinity_threshold_ece_dsm: {v: 1.7, unit: "dS/m", src: FAO29_T4, status: extracted, note: "100%-yield ECe; fao-29 row 'Corn (maize) (Zea mays) 1.7'."}
  soil_ph_range: {v: {ph_min: 4.5, ph_max: 8.5, ph_opt_min: 5.0, ph_opt_max: 7.0}, unit: pH, src: ECOCROP_MIRROR, status: extracted}

- crop_id: rice
  names: {en: Rice, ar: أرز, scientific: Oryza sativa}
  category: cereal
  family: {v: Poaceae, src: GENERAL, status: general_fact}
  n_fixer: {v: false, src: GENERAL, status: general_fact}
  usual_slot: summer
  sowing_window: {v: {start: "04-20", end: "05-10"}, unit: "MM-DD", src: FAO_CROP_CAL, status: extracted, note: "Only FAO-calendar rice session for Egypt is Middle Egypt Region ('Fayoum'): sowing 04-20..05-10, harvest 08-01..09-30. NO Delta-region row in either FAO calendar — verify Delta dates locally (rice is grown in the Delta in practice; GIEWS 'rice sowing began in May' 2026)."}
  growth_duration_days: {v: 150, unit: days, src: FAO56_T11, status: extracted, note: "Row 'Rice' 30/30/60/30 = 150 (Tropics/Mediterranean). FAO calendar Egypt (Fayoum) growing_period 120-150 — analogue value at the top of the range; local check advised."}
  stage_days: {v: {ini: 30, dev: 30, mid: 60, late: 30}, unit: days, src: FAO56_T11, status: extracted, note: "Stages sum to 150 = growth_duration_days."}
  kc: {v: {ini: 1.05, mid: 1.20, end: 0.90}, unit: "-", src: FAO56_T12, status: extracted, note: "Kc end 0.90 or 0.60. Flooded paddy: FAO manual Ch.4 (SAT=200 mm, PERC 4-8 mm/d) — ETc EXCLUDES percolation/seepage/puddling water, so gross water need is higher; engine must flag rice_gross_water_underestimated."}
  water_requirement_mm_ref: {v: {min: 450, max: 700}, unit: "mm/season", src: FAO_WATER_T5, status: extracted, note: "Row 'Rice (paddy) 450-700'. Does not include paddy percolation losses."}
  temperature_c: {v: {topmn: 20.0, topmx: 30.0, tmin: 10.0, tmax: 36.0, ktmp: null}, unit: "°C", src: ECOCROP_MIRROR, status: extracted, note: "ktmp absent in the mirror row (null)."}
  drought_sensitivity: {v: high, unit: "low|medium|high", src: FAO_WATER_T14, status: extracted, note: "Table 14 prints 'high'. FAO-66 Table 1 lists NO rice row; paddy percolation losses (manual Ch.4) raise practical sensitivity further."}
  salinity_threshold_ece_dsm: {v: 3.0, unit: "dS/m", src: FAO29_T4, status: extracted, note: "100%-yield ECe; row 'Rice (paddy) (Oriza sativa) 3.0' (species typo in source)."}
  soil_ph_range: {v: {ph_min: 4.5, ph_max: 9.0, ph_opt_min: 5.5, ph_opt_max: 7.0}, unit: pH, src: ECOCROP_MIRROR, status: extracted}

