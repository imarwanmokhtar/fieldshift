  drought_sensitivity: {v: null, unit: "low|medium|high", src: FAO_WATER_T14, status: missing, note: "Berseem absent from manual Table 14 and from FAO-66 Table 1 (no Ky row); no citable class found in i3500e. Stays missing."}
  salinity_threshold_ece_dsm: {v: null, unit: "dS/m", src: FAO29_T4, status: missing, note: "FAO-29 sec.5 lists 'Clover, Berseem (Trifolium alexandrinum)' in the MODERATELY SENSITIVE group qualitatively; the numeric ECe table has NO berseem row. EcoCrop 'absolute soil salinity = high (>10 dS/m)' is a different definition — do not mix."}
  soil_ph_range: {v: {ph_min: 4.9, ph_max: 7.5, ph_opt_min: 6.5, ph_opt_max: 7.0}, unit: pH, src: ECOCROP_MIRROR, status: extracted}

