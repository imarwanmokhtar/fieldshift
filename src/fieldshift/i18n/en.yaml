  flag.history_unknown: "Part of the crop history is unknown. Confirm the existing rotation with the farmer."
  flag.season_unknown: "The season of the previous crop was unknown; the next slot was assumed to be winter. Confirm the sequence locally."
  flag.irrigation_unknown: "Irrigation availability is unknown, so the water-access comparison is limited."
  flag.season_overlap: "Crop growth windows overlap. Confirm sowing and harvest timing for these varieties locally."
