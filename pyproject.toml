[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift"
version = "0.1.0"
description = "Field Shift: rotation exploration engine for the NASA Space Apps Egypt pilot (Dakahlia). Terminal app; supports, does not replace, farmer judgment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]
geo = ["rasterio", "earthaccess"]

[project.scripts]
fieldshift = "fieldshift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "RUF"]
